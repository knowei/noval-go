<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><style>
*{box-sizing:border-box}body{margin:0;background:#102427;color:#edf6ed;font:16px/1.8 system-ui,sans-serif}.page{max-width:970px;margin:auto;padding:50px 45px;background:radial-gradient(ellipse at 100% 0,#2c5149,transparent 60%)}.over{color:#b9e281;font-size:12px;letter-spacing:3px}h1{font:54px/1.25 Georgia,"Songti SC",serif;letter-spacing:3px;margin:20px 0}h1 span{display:block;color:#b9e281}p{color:#adc5bf;max-width:650px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin-top:35px;border-top:1px solid #36504d;padding-top:30px}h2{font-size:20px;font-weight:500;margin:0 0 20px}.fact{border-left:2px solid #b9e281;padding-left:16px;margin-bottom:22px}.fact small{display:block;color:#a8bfb9;font-size:14px}label{display:block;color:#adc5bf;font-size:14px;margin-bottom:16px}input,select,button{font:inherit;width:100%;border:1px solid #44645b;border-radius:8px;padding:12px;background:#122b2a;color:#fff;margin-top:6px}button{background:#b9e281;color:#142a23;font-weight:700;cursor:pointer;margin-top:10px}footer{font-size:12px;color:#8fa8a2;margin-top:22px}@media(max-width:600px){.page{padding:32px 23px}h1{font-size:38px}.grid{grid-template-columns:1fr;gap:22px}p{font-size:15px}}
</style></head><body><div class="page"><div class="over">ANOTHER LIFE / CHAPTER ZERO</div><h1 id="title">转生史莱姆<span>森林来信</span></h1><p id="description">没有传说中的力量，没有注定胜利的命运。只有一副柔软的身体，一片未知的森林，和一封等你送达的信。</p><div class="grid"><section><h2>这一次，写你自己的故事。</h2><div class="fact">从弱小开始<small>感知、学习与选择，一点点决定你的成长。</small></div><div class="fact">冲突不止一种解法<small>观察环境，结识伙伴，也可以选择绕路。</small></div><div class="fact">旅途会留下痕迹<small>状态、物品与重要约定随存档一起保存。</small></div></section><form id="form"><h2>你是谁？</h2><label>给自己一个称呼<input name="name" maxlength="24" value="露米" required></label><label>最初的天赋<select name="talent"><option value="感知">微量感知 · 更擅长调查</option><option value="交涉">心意传达 · 更擅长交涉</option><option value="探索">柔韧躯体 · 更擅长探索</option></select></label><button>在森林中醒来 ↗</button><footer>非官方同人原创支线 · 不复述小说章节<br>默认离线试玩，连接模型后支持自由行动。</footer></form></div></div><script>
let channel='';window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='configure')return;channel=e.data.channel;document.getElementById('title').textContent=e.data.title;document.getElementById('description').textContent=e.data.description;});document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const form=new FormData(e.target);parent.postMessage({type:'start-adventure',channel,name:form.get('name'),talent:form.get('talent')},'*');});parent.postMessage({type:'intro-ready'},'*');
</script></body></html>
