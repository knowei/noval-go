services:
  # -----------------------------------------------------------------
  # 1. 前后端一体化主应用服务 (Next.js 16 + Python API)
  # -----------------------------------------------------------------
  noval-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noval-go
    restart: unless-stopped
    ports:
      # 映射主机端口:容器端口 (浏览器访问 http://服务器IP:3000)
      - "3000:3000"
    environment:
      - PORT=3000
      - NOVAL_PORT=5173
      - BACKEND_URL=http://127.0.0.1:5173
      - NODE_ENV=production
      # 默认连接内部 PostgreSQL 容器 (内部网络直连，避免与宿主机 5432 端口冲突)
      - DATABASE_URL=postgresql://noval_user:noval_secret_2026@postgres:5432/noval_db
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------------
  # 2. 官方 PostgreSQL 16 生产级数据库服务
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: noval-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=noval_user
      - POSTGRES_PASSWORD=noval_secret_2026
      - POSTGRES_DB=noval_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      # 数据永久持久化至宿主机 ./pgdata 目录
      - ./pgdata:/var/lib/postgresql/data
      # 首次启动自动执行建表与全量 60 部剧本、38 张卡片数据灌库
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noval_user -d noval_db"]
      interval: 3s
      timeout: 5s
      retries: 5
