version: '3.8'

services:
  noval-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noval-go
    restart: unless-stopped
    ports:
      # 映射主机端口:容器端口。如果 3000 端口已被占用，可修改为 "3001:3000" 或 "8888:3000"
      - "3000:3000"
    volumes:
      # 持久化数据目录，保障 SQLite 数据库及历史存档安全
      - ./data:/app/data
    environment:
      - PORT=3000
      - NOVAL_PORT=5173
      - NOVAL_DB_PATH=/app/data/noval_data.db
      - BACKEND_URL=http://127.0.0.1:5173
      - NODE_ENV=production
